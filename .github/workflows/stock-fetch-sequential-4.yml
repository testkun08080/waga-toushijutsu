name: 📊 Sequential Stock Fetch - Part 4 (Final)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      market:
        description: "市場 (日本株=JP / 米国株=US)"
        required: true
        default: "JP"
        type: choice
        options:
          - "JP"
          - "US"
      reason:
        description: "開始理由（オプション）"
        required: false
        default: "Sequential stock data collection - Part 4 (Final)"
        type: string

jobs:
  fetch-stocks-4-final:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    outputs:
      success: ${{ steps.process.outcome == 'success' }}

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r stock_list/requirements.txt

      - name: 📋 Show process info
        run: |
          MARKET="${{ github.event.inputs.market }}"
          if [ "$MARKET" = "US" ]; then FILE=us_stocks_4.json; else FILE=stocks_4.json; fi
          echo "🚀 Sequential Stock Fetch - Part 4/4 (Final) (market=$MARKET)"
          echo "Processing file: $FILE"
          echo "Reason: ${{ github.event.inputs.reason }}"
          echo "Timestamp: $(date)"
          ls -la stock_list/

      - name: 🏃 Process Part 4 (Final)
        id: process
        working-directory: ./stock_list
        run: |
          MARKET="${{ github.event.inputs.market }}"
          if [ "$MARKET" = "US" ]; then FILE=us_stocks_4.json; else FILE=stocks_4.json; fi
          echo "🚀 Starting stock data collection for $FILE (Final part)..."
          echo "Timestamp: $(date)"

          python sumalize.py "$FILE"

          echo "✅ Part 4 (Final) completed successfully"
          echo "📄 Generated files in Export directory:"
          ls -la Export/ 2>/dev/null || echo "No files in Export directory"
          echo ""
          echo "🎉 ALL SEQUENTIAL STOCK FETCH PARTS COMPLETED! (market=$MARKET)"
          echo "📊 All 4 parts have been processed"

      - name: Git config and pull
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true

      - name: 💾 Commit changes - Part 4 (Final)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🎉 Sequential Stock Fetch - 全4部完了！ ($(date +'%Y年%m月%d日 %H:%M'))"
          push_options: --force

  completion-summary:
    needs: fetch-stocks-4-final
    runs-on: ubuntu-latest
    if: needs.fetch-stocks-4-final.outputs.success == 'true'

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: 📊 Generate completion summary
        run: |
          MARKET="${{ github.event.inputs.market }}"
          echo "🎉 SEQUENTIAL STOCK FETCH COMPLETED SUCCESSFULLY! (market=$MARKET)"
          echo "================================================="
          echo "⏰ Completion time: $(date)"
          echo "📂 All data exported to: stock_list/Export/"
          if [ "$MARKET" = "US" ]; then
            echo "  ✅ Part 1-4: us_stocks_1.json - us_stocks_4.json"
          else
            echo "  ✅ Part 1-4: stocks_1.json - stocks_4.json"
          fi
          echo ""
          ls -la stock_list/Export/ 2>/dev/null || echo "No files found"
          echo "🚀 CSV Combine will be triggered (market_type=$MARKET)"

      - name: 🔗 Workflow Chain Info
        run: |
          echo "✅ Part 4 completed successfully"
          echo "🔄 Next: CSV Combine & Export (market_type=${{ github.event.inputs.market }})"

      - name: 🚀 Trigger CSV Combine & Export
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const market = '${{ github.event.inputs.market }}' || 'JP';
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'csv-combine-export.yml',
              ref: 'main',
              inputs: {
                reason: 'Auto-triggered after Sequential Stock Fetch Part 4 completion',
                market_type: market
              }
            });
            console.log('✅ Triggered: CSV Combine & Export (market_type=' + market + ')');
