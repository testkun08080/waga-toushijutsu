name: 📊 Sequential Stock Fetch - Part 2

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      market:
        description: "市場 (日本株=JP / 米国株=US)"
        required: true
        default: "JP"
        type: choice
        options:
          - "JP"
          - "US"
      reason:
        description: "開始理由（オプション）"
        required: false
        default: "Sequential stock data collection - Part 2"
        type: string

jobs:
  fetch-stocks-2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    outputs:
      success: ${{ steps.process.outcome == 'success' }}

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r stock_list/requirements.txt

      - name: 📋 Show process info
        run: |
          MARKET="${{ github.event.inputs.market }}"
          if [ "$MARKET" = "US" ]; then FILE=us_stocks_2.json; else FILE=stocks_2.json; fi
          echo "🚀 Sequential Stock Fetch - Part 2/4 (market=$MARKET)"
          echo "Processing file: $FILE"
          echo "Reason: ${{ github.event.inputs.reason }}"
          echo "Timestamp: $(date)"
          ls -la stock_list/

      - name: 🏃 Process Part 2
        id: process
        working-directory: ./stock_list
        run: |
          MARKET="${{ github.event.inputs.market }}"
          if [ "$MARKET" = "US" ]; then FILE=us_stocks_2.json; else FILE=stocks_2.json; fi
          echo "🚀 Starting stock data collection for $FILE..."
          echo "Timestamp: $(date)"

          python sumalize.py "$FILE"

          echo "✅ Part 2 completed successfully"
          echo "📄 Generated files in Export directory:"
          ls -la Export/ 2>/dev/null || echo "No files in Export directory"

      - name: Git config and pull
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true

      - name: 💾 Commit changes - Part 2
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📊 Sequential Stock Fetch - Part 2/4 完了 ($(date +'%Y年%m月%d日 %H:%M'))"
          push_options: --force

  trigger-part-3:
    needs: fetch-stocks-2
    runs-on: ubuntu-latest
    if: needs.fetch-stocks-2.outputs.success == 'true'

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Trigger Part 3
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const market = '${{ github.event.inputs.market }}' || 'JP';
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'stock-fetch-sequential-3.yml',
              ref: 'main',
              inputs: {
                market: market,
                reason: 'Auto-triggered by Part 2 completion'
              }
            });
            console.log('✅ Part 3 triggered (market=' + market + ')');
